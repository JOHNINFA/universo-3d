    if(bueno&&!malo){p.d.chispa+=1.5;p.d.bonoAnimo=(p.d.bonoAnimo||0)+6;p.d.fe+=1;}else if(malo){p.d.chispa-=2.5;p.d.bonoAnimo=(p.d.bonoAnimo||0)-8;p.d.fe-=1;}
    agregarMemoria(p,'El Creador me dijo: «'+msg.slice(0,60)+'»','conversación');
    let r;try{r=await window.respond(p,msg);}catch(e){r=respuestaLocal(p,msg);}
    addChat(p.nombre,r);if(modo==='mundo'||modo==='ser')decir(p,r.length>90?r.slice(0,88)+'…':r,6000);actualizarCreencia(p);
  }
  if(convDest==='todos'&&personas.length>dest.length)addChat('Valle','(Respondieron '+dest.length+' de '+personas.length+'; los demás escuchan)');
}
/* Conecta aquí una IA: define window.UNIVERSO_API='https://tu-servidor/respond' (recibe {personaje,mensaje,contexto} y devuelve {respuesta}).
   Si no hay API o falla, responde con la lógica local de respaldo. */
window.respond=async function(personaje,mensaje){
  const p=personaje,d=p.d;
  if(window.UNIVERSO_API){try{const res=await fetch(window.UNIVERSO_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({personaje:{nombre:d.nombre,rol:d.rol,edad:Math.floor(d.edadVirtual),personalidad:PERSONALIDAD[d.nombre]||'amable',chispa:d.chispa,fe:d.fe,creencia:d.creencia,animo:d.animoh,hambre:d.hambre,energia:d.energia,memoria:d.memoria.slice(-6).map(m=>m.texto)},mensaje,contexto:{hora:fechaTxt(),mitos:mitosActivos}})});if(res.ok){const j=await res.json();if(j.respuesta)return j.respuesta;}}catch(e){console.warn('API de IA no disponible, uso respuestas locales',e);}}
  return respuestaLocal(p,mensaje);
};
const MULETILLA={curiosa:'Mmm, qué interesante…',práctico:'Vamos al grano:',soñadora:'Mira las estrellas… ah, perdón.',inquieto:'¡Rápido, rápido!',dulce:'Con cariño te digo:',alegre:'¡Ja! ',compasiva:'Con el corazón:',trabajador:'Entre tarea y tarea:',paciente:'Con calma:',reservado:'…',creativo:'Se me ocurre que',creativa:'Se me ocurre que',tranquilo:'Sin prisa:'};
function respuestaLocal(p,mensaje){
  const d=p.d,m=mensaje.toLowerCase(),c=d.chispa,per=PERSONALIDAD[d.nombre]||(d.edadVirtual<14?'curiosa':'amable'),mul=(MULETILLA[per]||'')+' ';
  const sent=c>66?'bien':c>33?'regular':'mal';const ult=d.memoria.filter(x=>x.tipo!=='pensamiento').slice(-1)[0];
  let r;
  if(d.creencia==='falso dios'&&/(creador|verdad|falso|soberano|dios)/.test(m))r='El Gran Soberano dice que él nos cuida. No me pidas que desobedezca.';
  else if(/(falso|soberano|gobernante|dios|creer|crees|fe\b)/.test(m))r=d.creencia==='duda'?'No sé en quién creer, Creador. Unos hablan del Soberano, otros de ti… necesito una señal.':d.creencia==='falso dios'?'El Soberano nos pide obediencia. Quizá tenga razón.':'Yo creo en ti, Creador. Lo que nace en mí es luz, no miedo.';
  else if(/(luces|cielo|visitante|nave|estrella)/.test(m))r=mitosActivos?'Vi luces moverse sobre el valle, Creador. ¿Vienen de otros mundos?':'El cielo está tranquilo. Las estrellas se ven hermosas.';
  else if(/(hola|buen[oa]s|saludo)/.test(m))r=c>66?'¡Hola, Creador! Qué alegría tenerte aquí.':c>33?'Hola… te escucho.':'Hola. Hoy me cuesta sonreír.';
  else if(/(c[oó]mo est|c[oó]mo te sientes|ánimo|animo|triste|content)/.test(m))r='Me siento '+sent+'. '+(d.hambre>65?'Tengo hambre. ':'')+(d.energia<30?'Y estoy muy cansado.':d.animoh>65?'El valle está lindo hoy.':'Ya mejorará.');
  else if(/(hambre|comer|comida)/.test(m))r=d.hambre>55?'Sí, tengo hambre. Un poco de cosecha no vendría mal.':'Comí hace poco, gracias.';
  else if(/(cansad|dormir|descans|energ)/.test(m))r=d.energia<35?'Estoy agotado, necesito dormir.':'Tengo energía para seguir.';
  else if(/chispa/.test(m))r='Mi chispa está en '+Math.round(c)+'/100. Crece con las buenas obras y se apaga con la crueldad.';
  else if(/(recuerd|pas[oó]|hoy|ayer|qu[eé] hiciste)/.test(m))r=ult?'Recuerdo esto: '+ult.texto+' (día '+ult.dia+').':'Aún no me ha pasado gran cosa.';
  else if(/(familia|pareja|hij|espos|casar)/.test(m))r=d.parejaId?'Mi pareja es '+d.parejaId+(d.hijos.length?' y tenemos a '+d.hijos.join(' y ')+'.':'.'):'Aún no formo una familia.';
  else if(/(trabajo|haces|oficio|rol)/.test(m))r='Soy '+d.rol.toLowerCase()+'. '+d.frase;
  else if(/(qui[eé]n eres|nombre|edad|a[nñ]os)/.test(m))r='Soy '+d.nombre+', tengo '+Math.floor(d.edadVirtual)+' años. '+d.frase;
  else if(/(milagro|lluvia|cosecha|sana)/.test(m))r='Los milagros son tuyos, Creador. Nosotros solo podemos agradecer y cuidar lo que damos.';
  else if(PALABRAS_BUENAS.test(m))r=c>50?'Tus palabras me dan calma, Creador.':'Gracias… lo necesitaba.';
  else if(PALABRAS_MALAS.test(m))r=c>50?'Eso duele, Creador. Pero entiendo que sigues observando.':'No merezco eso… me apagas la chispa.';
  else r=c>55?(d.pensamientos[Math.floor(Math.random()*d.pensamientos.length)]||'Te escucho, Creador.'):(ult?'Estaba pensando en: '+ult.texto:'…');
  return mul+r;
}

  else if(tipo==='sanacion'){afectar((d)=>{d.energia+=25;d.chispa+=1.5;d.fe+=4;d.bonoAnimo=(d.bonoAnimo||0)+18;},'Una luz tibia me sanó el cuerpo y el ánimo.');desc='Sanación: energía y ánimo restaurados.';efectoSanacion();}
  else if(tipo==='señal'){afectar((d,p)=>{if(d.chispa>45){d.fe+=7;}else{d.fe+=2;d.devFalso-=4;}},'Vi una señal luminosa cruzar el cielo.');desc='Señal en el cielo: una luz cruza el firmamento; los habitantes se preguntan qué significa.';efectoSenal();
    if(mitosActivos){const p=personas[Math.floor(Math.random()*personas.length)];setTimeout(()=>decir(p,'¿Será una nave de otro mundo… o una señal del Creador?',6000),1200);}}

function lugarLibre(rmin,rmax){for(let k=0;k<80;k++){const a=Math.random()*6.283,r=rmin+Math.random()*(rmax-rmin),x=Math.cos(a)*r,z=Math.sin(a)*r;if(mundoObj.libre(x,z)&&construcciones.every(c=>Math.hypot(c.x-x,c.z-z)>2.2))return[x,z];}return null;}
function construirObjeto(tipo,x,z,rot){
  const g=new THREE.Group();g.position.set(x,mundoObj.groundY(x,z),z);g.rotation.y=rot;let r=0.9;

  else if(tipo==='farol'){const poste=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,2.2,8),mt(0x2e2e34));poste.position.y=1.1;poste.castShadow=true;g.add(poste);const luz=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,10),new THREE.MeshStandardMaterial({color:0xffe9a8,emissive:0xffcf70,emissiveIntensity:1.6}));luz.position.y=2.3;g.add(luz);r=0.4;}
  else if(tipo==='altar'){caja(1.6,0.25,1.6,0x8d8d95,0.12);caja(1.1,0.3,1.1,0x9d9da6,0.4);caja(0.6,0.6,0.6,0xaeb0ba,0.85);const orbe=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,12),new THREE.MeshStandardMaterial({color:0xbfe4ff,emissive:0x6fb4ff,emissiveIntensity:1.4}));orbe.position.y=1.45;g.add(orbe);r=1.1;}
  else if(tipo==='cabaña'){caja(2.2,1.3,1.8,0xb98d5a,0.65);const te=new THREE.Mesh(new THREE.ConeGeometry(1.7,1,4),mt(0x9a3b2a));te.position.y=1.8;te.rotation.y=Math.PI/4;te.scale.z=0.85;te.castShadow=true;g.add(te);caja(0.45,0.8,0.05,0x4a3220,0.4).position.z=0.9;r=1.5;}

function construir(tipo){

  afectar((d)=>{d.bonoAnimo=(d.bonoAnimo||0)+efecto[0];d.chispa+=efecto[1];d.fe+=(tipo==='altar'?6:2);},efecto[2]);

function efectoLluvia(){const N=500,pos=new Float32Array(N*3);for(let i=0;i<N;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*14;pos.set([Math.cos(a)*r,Math.random()*12,Math.sin(a)*r],i*3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0xaed6ff,size:0.09,transparent:true,opacity:0.8,depthWrite:false}));isla.add(pts);
  efectos.push({t:0,dur:14,upd(dt){this.t+=dt;const p=g.attributes.position;for(let i=0;i<N;i++){let y=p.getY(i)-dt*(9+(i%5));if(y<0)y+=12;p.setY(i,y);}p.needsUpdate=true;pts.material.opacity=0.8*Math.min(1,Math.min(this.t,this.dur-this.t));},fin(){isla.remove(pts);g.dispose();}});}
function efectoCosecha(){const g=new THREE.Group();for(let i=0;i<14;i++){const a=i/14*6.283,r=1.4+(i%2)*0.35;const f=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8),mt([0xe8602c,0xf0b429,0x9cc94a][i%3]));f.position.set(Math.cos(a)*r,0.2,Math.sin(a)*r);f.position.y=mundoObj.groundY(f.position.x,f.position.z)+0.14;g.add(f);}isla.add(g);efectos.push({t:0,dur:70,upd(dt){this.t+=dt;g.scale.setScalar(Math.min(1,this.t*2)*(this.dur-this.t<3?(this.dur-this.t)/3:1));},fin(){isla.remove(g);}});}

function actualizarPersona(p,dt,t){p.t-=dt;p.miraT-=dt;if(p.estado==='seleccionado'){p.vel+=(0-p.vel)*(1-Math.exp(-dt*6));pw.copy(camera.position);isla.worldToLocal(pw);const objetivo=Math.atan2(pw.x-p.x,pw.z-p.z);p.yaw+=clamp(wrap(objetivo-p.yaw),-3.2*dt,3.2*dt);p.mira=camera.position;p.habla=false;p.escucha=false;p.a.update(dt,t,{velocidad:0,saluda:(t-p.selT)<4.5,mirar:camera.position,habla:(t-p.selT)<4.5});}else{if(p.estado==='quieto'&&p.t<=0){if(!decidir(p)){p.estado='camina';[p.tx,p.tz]=puntoLibre();p.atasco=0;p.meta=null;}}if(p.estado==='va-charla'&&p.llego){p.estado='charla';p.llego=false;}if(p.estado==='charla'&&p.pareja){cabezaMundo(p.pareja,pw2);p.mira=pw2.clone();}else if(p.miraT<=0){p.miraT=2+Math.random()*4;p.mira=null;if(Math.random()<0.55){const cerca=personas.filter(o=>o!==p&&Math.hypot(o.x-p.x,o.z-p.z)<4).sort((u,v)=>Math.hypot(u.x-p.x,u.z-p.z)-Math.hypot(v.x-p.x,v.z-p.z))[0];if(cerca)p.mira=cabezaMundo(cerca,new THREE.Vector3());}else if(Math.random()<0.15)p.mira=camera.position.clone();}const real=moverPersona(p,dt);if(p.estado==='charla'&&p.pareja){const objetivo=Math.atan2(p.pareja.x-p.x,p.pareja.z-p.z);p.yaw+=clamp(wrap(objetivo-p.yaw),-3*dt,3*dt);}p.a.update(dt,t,{velocidad:real,habla:p.habla,escucha:p.escucha,mirar:p.mira});}p.tumb=(p.tumb||0)+((p.estado==='dormir'?1:0)-(p.tumb||0))*(1-Math.exp(-dt*3));p.a.group.position.set(p.x,mundoObj.groundY(p.x,p.z)+p.tumb*0.2,p.z);p.a.group.rotation.set(-p.tumb*1.45,p.yaw,0,'YXZ');}
function iniciarConversacion(){const libres=personas.filter(p=>(p.estado==='quieto'||p.estado==='camina'||p.estado==='reunirse')&&p!==sel&&!p.meta);if(libres.length<2)return;const a=libres[Math.floor(Math.random()*libres.length)];let b=libres.filter(p=>p!==a).sort((u,v)=>Math.hypot(u.x-a.x,u.z-a.z)-Math.hypot(v.x-a.x,v.z-a.z))[Math.floor(Math.random()*2)]||libres.find(p=>p!==a);let ml=puntoLibre();const dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz)||1,nx=-dz/L,nz=dx/L;const ax=ml[0]+nx*0.55,az=ml[1]+nz*0.55,bx=ml[0]-nx*0.55,bz=ml[1]-nz*0.55;if(!mundoObj.libre(ax,az)||!mundoObj.libre(bx,bz))return;a.estado='va-charla';b.estado='va-charla';a.tx=ax;a.tz=az;b.tx=bx;b.tz=bz;a.pareja=b;b.pareja=a;a.atasco=b.atasco=0;conv={a,b,fase:'va',t:0,dur:9+Math.random()*8,turno:0,quien:a,tTurno:0};}
